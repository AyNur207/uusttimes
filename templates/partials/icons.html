{% macro icon(name, class_name='') -%}
<svg class="icon {{ class_name }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'heart' %}
  <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
  {% elif name == 'arrow' %}
  <path d="M4 12h16m-6-6 6 6-6 6"/>
  {% elif name == 'paper' %}
  <path d="M5 3h14v18H5zM9 7h6M9 11h6M9 15h2m3 0h1"/>
  {% elif name == 'spark' %}
  <path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/>
  {% endif %}
</svg>
{%- endmacro %}
