{% if pagination.pages > 1 %}
<nav class="news-pagination" aria-label="Страницы новостей">
  {% if pagination.has_prev %}<a class="button button--outline" href="{{ url_for(request.endpoint, page=pagination.prev_num) }}">← Назад</a>{% endif %}
  <span>Страница {{ pagination.page }} из {{ pagination.pages }}</span>
  {% if pagination.has_next %}<a class="button button--outline" href="{{ url_for(request.endpoint, page=pagination.next_num) }}">Далее →</a>{% endif %}
</nav>
{% endif %}
